# 발행처 레지스트리 (설계서 v4.6 4.2). 항목을 바꾸면 registry_version을 올린다.
#
# method
#   rss        : feed_url의 RSS/Atom을 순회한다.
#   sitemap    : feed_url의 sitemap.xml(lastmod)을 순회한다.
#   list_html  : list_url 목록 페이지에서 list_selector(CSS)에 맞는 링크를 모은다.
#   llm_only   : 스크립트가 순회하지 않는다. LLM 탐색 프롬프트의 "우선 확인 발행처"로 들어간다.
# verified
#   true  : `python -m collector check-sources`로 접속·항목 수를 확인한 발행처.
#           프롬프트에서 "이미 순회한 발행처"로 안내된다.
#   false : 아직 확인 전. 순회는 시도하지만 프롬프트에서는 "우선 확인 발행처"로도 안내해
#           순회가 실패해도 LLM 탐색으로 보완되게 한다.
# url_prefixes : 같은 도메인을 여러 발행처가 나눠 쓸 때 URL 앞부분으로 구분한다.
# source_type: 정부·공공기관의 공식 발표(EU 집행위원회, 국가기술표준원 등)는 standards_body로 둔다(설계서 9.10의 '공식 원문'에 해당).
# include_url_patterns / exclude_url_patterns : 정규식. 발행처 단위로 명백히 무관한 경로만 제외한다
#   (분야 적합성 판정은 사내에서 한다. 설계서 3장).
# 아래 URL은 공개 정보 기준의 초기값이며 모두 verified: false다. 첫 실행 전에 check-sources로 확인한다.

