# 소식지 약어·용어 풀이 (설계서 9.8 '약어 풀이'). 본문에서 이번 호 첫 등장에 괄호로 붙고, '이번 호 용어 사전'에 모인다.
# 풀이는 25자 안팎. 검토 요청 ②의 [G]에서 확정한 새 풀이는 발송 확정 때 여기에 추가된다.
# common: 풀이 없이 쓰는 공통어(약어 검사에서 제외)
glossary_version: "2026-11-26.1"

common: [AI, IT, CEO, CTO, R&D, IR, PC, GPU, CPU, USB, OK, EU, US, AX, DX]

terms:
  # 제조·공정
  ADC: 자동 결함 분류
  AMHS: 웨이퍼를 자동으로 실어 나르고 보관하는 팹 물류 시스템
  OHT: 천장 레일을 달리는 웨이퍼 운반 장치
  FDC: 설비 데이터로 이상을 실시간 감지·분류하는 시스템
  APC: 공정 결과를 보고 다음 공정 조건을 자동 보정하는 제어
  SPC: 통계로 공정 이상을 감시하는 관리 기법
  MES: 생산 실행 관리 시스템
  EES: 설비 엔지니어링 데이터 시스템
  VM: 가상계측, 센서 데이터로 계측값을 예측
  CMP: 화학적 기계 연마
  ALE: 원자층 단위 식각
  ALD: 원자층 단위 증착
  EUV: 극자외선 노광
  PPAP: 양산 부품 승인 절차
  Qual: 장비·공정의 양산 적용 인증
  hold: 설비·로트를 멈춰 세우는 조치
  인터락: 이상 시 설비를 자동으로 멈추는 안전 장치
  서브팹: 팹 아래층의 펌프·배관·유틸리티 설비 공간
  웨이퍼 맵: 웨이퍼 위 칩별 불량 분포 지도
  # 테스트·패키징
  ATE: 자동 테스트 장비
  SLT: 실제 사용 조건에 가까운 시스템 수준 테스트
  PVTW: 공정·전압·온도·부하 조건
  HBM: 고대역폭 메모리(D램 적층)
  CXL: CPU와 메모리를 잇는 고속 연결 규격
  EMIB: Intel의 칩 연결 패키징 기술
  # AI·디지털
  LLM: 대규모 언어 모델
  Physical AI: 현실 공간에서 보고 판단해 움직이는 AI(로봇 등)
  AAS: 자산관리셸, 설비 데이터 표준 틀
  PINN: 물리 법칙을 반영해 학습하는 신경망
  디지털 트윈: 실제 설비·공장을 가상 공간에 복제한 모델
  # 기업·행사
  GF: GlobalFoundries, 미국 파운드리 기업
  TEL: Tokyo Electron, 일본 장비사
  AMAT: Applied Materials, 미국 장비사
  SEMICON West: 미국 반도체 장비·재료 전시회
  SEMI: 국제반도체장비재료협회
  OSAT: 반도체 후공정 외주 업체
