# MTC AX/PI 위클리 설정값 (설계서 v4.7 10장). 값을 바꾸면 config_version을 올린다.
config_version: "11"

paths:
  work_dir: work      # 주차별 작업 폴더: candidates/, manual/, prompts/
  out_dir: out        # 주차별 결과: pass1/pass2/merged/intake/report, package/

collection:
  user_agent: "Mozilla/5.0 (compatible; MTC-AX-Weekly-Collector/0.1)"
  accept_language: "ko,en;q=0.9,ja;q=0.8"
  fetch_timeout_sec: 30
  fetch_retries: 3
  retry_backoff_sec: 2          # 2, 4, 8초 지수 백오프
  per_host_delay_sec: 1.0       # 같은 호스트 연속 요청 간격
  max_bytes: 30000000           # 응답 최대 크기(PDF 포함)
  browser_fallback: true        # playwright가 설치돼 있으면 pass2에서 렌더링 재시도
  feed_date_margin_days: 1      # 피드 날짜 힌트로 건너뛸 때 두는 여유일
  max_items_per_source: 200
  # 이미지 정책(설계서 4.4): 공식 발표 발행처의 complete 레코드만 이미지 후보를 내려받는다
  media_source_types: [company_official, standards_body, research_lab]
  media_max_per_doc: 5
  media_min_px: 300             # 가로·세로 중 하나라도 이보다 작으면 제외(로고·추적 픽셀)
  media_max_px: 1200            # 긴 변이 이보다 크면 줄인다

extraction:
  min_body_chars: 200
  lead_min_chars: 40
  # <title>에 있으면 봇 차단 페이지로 본다 → ACCESS_BLOCKED
  block_page_markers: ["Just a moment", "Attention Required", "Access Denied", "Are you a robot", "Request unsuccessful"]
  # 본문이 짧은데 페이지에 이 문구가 있으면 로그인·구독 벽으로 본다 → ACCESS_BLOCKED
  login_markers: ["sign in to continue", "log in to continue", "subscribe to continue", "to continue reading",
                  "회원만", "로그인 후", "로그인이 필요", "구독자 전용", "유료 회원", "会員登録", "ログインして"]
  # 마지막 블록 끝에 있으면 본문이 잘린 것으로 본다 → BODY_TRUNCATED
  truncation_markers: ["continue reading", "read the full article", "기사 전문 보기", "続きを読む"]

blocked_domains: []             # 콘텐츠 팜·익명 재전재 도메인 → UNTRUSTED_SOURCE

thresholds:
  intake_min: 10
  intake_target: 15

# 사내 파이프라인 값 (설계서 7.2, 9장)
internal:
  core_min_score: 80
  core_max: 6                 # 핵심 최대 건수(v4.7 개편)
  core_mtc_min: 30            # 핵심 자격: MTC 연관성(적용 영역 + 대상) 최소 점수. 미달이면 게재 상한이 단신
  core_gap: 10                # 핵심 낙차 컷(9.5): 바로 앞 사건보다 이 점수 이상 떨어지는 첫 지점에서 핵심을 자른다(상한 없음)
  core_min_count: 4           # 최소 핵심 건수. 80점 이상이 모자라면 핵심 자격(MTC 연관성 충족) 사건을 점수 순으로 채운다. 낙차 컷은 이 건수 뒤부터
  core_alert_count: 8         # 핵심이 이 건수를 넘으면 검토 요청 ①에 '줄이려면 순위를 조정하세요'를 표시한다
  competitor_core_min: 2      # 핵심 자격이 있는 경쟁사 사건을 핵심에 먼저 배정하는 최소 건수
  brief_min_score: 55
  ledger_lookback_issues: 12
  article_title_max: 50        # 전문 용어에 쉬운 수식어를 붙일 여유(36 → 50)
  issue_title_max: 30         # 이번 주 헤드라인
  summary_chars: [140, 240]   # 한 줄 요약(총론) 2~3문장: 이번 주 흐름 + 왜 중요한지
  punch_chars: 320            # 이번 주 한 방(text+twist, big 제외): 무엇을 잰 숫자인지 + 무엇과 비교해 왜 중요한지
  core_chars: [400, 640]      # 핵심 본문(자세히: 배경·방식·조건·업계 맥락 4~6문장). 요점(points)과 겹치지 않게
  brief_chars: [90, 150]      # 단신 2문장: 무슨 일 + 왜 볼 만한지
  issue_body_max: 11000       # 한 방 + 핵심(한 줄 핵심·요점·본문·MTC AX Insight·수치 의미) + 단신 합계(핵심 6·단신 6 기준, 약 17분)
  deck_chars: 120             # 핵심 기사 한 줄 핵심(30초 브리핑에도 쓴다): 주체·사건·결과 + 왜 중요한지
  point_chars: 180            # 핵심 기사 요점(무슨 일 · 얼마나 · 왜 중요 · 어디까지) 각 1~2문장
  figure_why_chars: 80        # 수치의 "왜 중요"(비교 기준·업무상 의미)
  read_chars_per_min: 500     # 읽는 시간 표시용 분당 글자 수
  # 경쟁 칩메이커(1장 주 목적). 사건 주체(없으면 대표 자료 발행처·제목)가 이름·별칭과 대소문자 무시로 일치하면 경쟁사 사건이다(9.5).
  # 사외 queries.yaml의 competitors와 같은 회사 목록을 쓴다.
  competitors:
    - {name: "SK hynix", aliases: ["SK하이닉스", "SK Hynix", "하이닉스"]}
    - {name: "Micron", aliases: ["Micron Technology", "마이크론"]}
    - {name: "TSMC", aliases: ["台積電", "台积电", "Taiwan Semiconductor", "대만 TSMC"]}
    - {name: "Intel (Foundry)", aliases: ["Intel", "Intel Foundry", "인텔"]}
    - {name: "GlobalFoundries", aliases: ["GF", "글로벌파운드리스"]}
    - {name: "UMC", aliases: ["聯電", "联电", "United Microelectronics"]}
    - {name: "SMIC", aliases: ["中芯国际", "中芯國際", "Semiconductor Manufacturing International"]}
    - {name: "Kioxia", aliases: ["キオクシア", "KIOXIA", "키옥시아", "Toshiba Memory"]}
    - {name: "SanDisk", aliases: ["샌디스크"]}
    - {name: "CXMT", aliases: ["长鑫存储", "長鑫存儲", "ChangXin Memory", "창신메모리"]}
    - {name: "YMTC", aliases: ["长江存储", "長江存儲", "Yangtze Memory", "양쯔메모리"]}
    - {name: "Nanya", aliases: ["南亞科", "南亚科", "Nanya Technology", "난야"]}
    - {name: "Winbond", aliases: ["華邦電", "华邦电", "Winbond Electronics", "윈본드"]}
    - {name: "PSMC", aliases: ["力積電", "力积电", "Powerchip", "Powerchip Semiconductor"]}
    - {name: "Rapidus", aliases: ["ラピダス", "라피더스"]}
  verbatim_max_run: 30
  brief_max: 6                # 단신 최대 건수(v4.7 개편)
  search_terms_max: 3         # 기사(핵심·단신)당 검색어 최대 개수. 근거 블록에 그대로 있는 원문 표기만 남긴다(9.7)
  same_subject_max: 2         # 핵심+단신에서 같은 주체 최대 건수
  watch_chars: 160            # 핵심 기사 'MTC AX Insight' 1~2문장
  more_max: 8                 # 더 볼 거리 최대 건수
  more_line_chars: 120        # 더 볼 거리: 무슨 자료인지 + 왜 볼 만한지
  newsletter_name: "MTC AX Tech Brief"            # 후보, 확정 전. B3 테마는 끝 두 단어(Tech Brief)를 강조색으로 쓴다
  newsletter_tagline: "메모리 제조기술센터 AX/PI팀이 매주 정리하는 팹 AI 브리프"
  newsletter_team: "삼성전자 DS부문 메모리 제조기술센터(MTC) AX/PI팀"   # 꼬리말 소개("…팀이 매주 화요일 보내는")
  image_caption_chars: 40       # 대표 이미지 설명(새로 쓴 문장)
  image_max_kb: 300             # 발송본 이미지 한 장의 파일 크기 상한(표시 폭 624px)
  newsletter_from: ""           # newsletter.eml의 From. 비우면 헤더를 넣지 않는다(편집자가 메일 프로그램에서 정한다)
  newsletter_theme: B6                               # B6 브리핑 리포트(기본 후보) / S4 매거진(후보) / B4·S·S2·S3·B5·E 이전 시안 / B3 / A·B·C(v4.4 구조)
  # 사내 모델 접속(OpenAI 호환 /v1/chat/completions, 예: vLLM·Ollama). 모든 LLM 단계가 같은 모델을 쓴다.
  llm:
    backend: http                         # http(OpenAI 호환 서버) | file(요청·응답 파일을 주고받음, 사람·에이전트가 모델 역할)
    base_url: "http://localhost:8000"
    model: "served-model"
    api_key_env: "INTERNAL_LLM_API_KEY"   # 환경변수 이름. 비어 있거나 변수가 없으면 인증 헤더를 보내지 않는다
    timeout_sec: 300
    seed: 42                              # 서버가 지원하면 요청에 실어 보낸다(9.11)
    max_input_chars: 60000                # 문서 하나의 본문 블록 합계 상한. 넘으면 끝을 "(이하 생략)"으로 자른다(9.11)
