  - event_id: EVT-SAMPLE-01
    slot: core
    title: 수 시간 걸리던 결함 원인 찾기, 삼성 AI 에이전트는 ‘수 분’
    title_alternatives: []
    tags: [칩메이커, 현장 실증·적용, 운영사 발표]
    deck: 삼성전자가 결함 원인 분석 AI 에이전트(Defect Agent)에 원인 추정을 맡겨 수 시간 걸리던 분석을 수 분으로 줄였다. 하루에 볼 수 있는 결함 수가 크게 늘 수 있다.
    points:
      what: 삼성전자는 결함 원인 분석 AI 에이전트(Defect Agent)로 결함 검출 → 유형 분류 → 원인 추정 → 조치 제안 중 원인 추정과 조치 제안을 먼저 맡기고 엔지니어는 최종 확인만 하게 했다.
      how_much: 엔지니어가 데이터를 하나씩 대조하느라 수 시간 걸리던 원인 분석이 수 분으로 줄었다고 회사는 밝혔다. 같은 인력으로 훨씬 많은 결함을 당일 안에 살펴볼 수 있게 된다는 의미다.
      why: 결함 원인 분석은 숙련 엔지니어의 경험에 기대던 대표적인 병목이다. 이 단계를 AI가 먼저 맡으면 수율 문제를 발견하고 대응하기까지의 시간이 줄어, 같은 문제로 버려지는 웨이퍼도 줄일 수 있다.
      scope: 회사 발표 기준이다. 적용한 공정과 라인 수, 에이전트가 제시한 원인이 실제로 맞았던 비율, 기존 분석 시스템과 어떻게 연결했는지는 공개하지 않았다.
    body: >-
      지금까지 결함 원인 분석은 엔지니어가 설비 로그, 계측 결과, 공정 이력을 화면 여러 개에 띄워 놓고 하나씩 대조하는 수작업이었다.
      경험이 많은 엔지니어일수록 빨리 찾지만, 그만큼 사람에 따라 속도와 결과가 달라지는 일이기도 했다.
      이번에 도입한 에이전트는 결함이 발견되면 관련 데이터를 한꺼번에 모아 원인 후보와 그 근거를 정리해 엔지니어에게 제시하고, 엔지니어는 후보를 확인하거나 버리는 역할을 맡는다.
      사람이 최종 판단을 맡는 구조라 AI가 틀렸을 때의 위험은 줄였지만, 엔지니어의 검토 시간은 별도로 든다.
      회사는 이 방식을 일부 팹에 적용했다고 밝혔으며, 어떤 공정부터 적용했는지와 앞으로의 확대 계획은 설명하지 않았다.
      업계에서는 그동안 결함을 ‘분류’하는 AI가 주로 쓰였는데, 이번 발표는 분류를 넘어 ‘왜 생겼는지’까지 AI가 먼저 답을 내는 단계로 넘어갔다는 점에서 다르다.
    watch: 우리 결함 분석에서 사람이 판단하는 단계 중 어디까지를 AI가 먼저 맡을 수 있을까? 엔지니어가 에이전트 후보를 채택한 비율이 공개되면 그 답의 기준이 된다.
    key_figures:
      - {value: 수 시간 → 수 분, label: 결함 원인 분석 소요 시간, why: 엔지니어 한 명이 하루에 볼 수 있는 결함 수가 크게 늘어 수율 대응이 빨라진다}
    image: null
    credits: ["삼성전자 반도체 뉴스룸, 「(견본) 결함 분석 에이전트 적용」, 2026-11-18"]
