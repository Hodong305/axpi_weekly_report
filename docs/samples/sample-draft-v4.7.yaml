  - event_id: EVT-SAMPLE-02
    slot: core
    title: 로봇개가 클린룸 아래 설비층 ‘서브팹’ 9만 건 점검…GF, 팹 4곳으로 확대
    title_alternatives: []
    tags: [Physical AI, 현장 실증·적용, 운영사 발표]
    deck: GlobalFoundries가 4족 보행 로봇 Spot의 서브팹 순회 점검을 팹 4곳으로 넓힌다. 누적 9만 건 넘게 점검해 사람이 돌던 반복 순찰을 로봇이 상시로 맡는 단계에 들어섰다.
    points:
      what: GlobalFoundries는 4족 보행 로봇 Spot이 서브팹의 배관·전력·가스 설비를 정해진 경로로 돌며 계기 판독, 열화상 촬영, 이상 소음 기록을 하도록 하고, 이 방식을 다른 팹 3곳에도 들여온다.
      how_much: 누적 점검 임무가 9만 건을 넘었고 임무 성공률은 99%다. 사람이 하루에도 여러 번 돌던 반복 순찰의 상당 부분을 로봇이 대신하고 있다는 뜻이다.
      why: 서브팹은 넓고 위험해 점검 인력이 많이 들지만 놓치면 생산 전체가 멈출 수 있는 곳이다. 로봇이 매일 같은 경로를 같은 방식으로 기록하면 사람마다 다르던 점검 품질이 고르게 되고, 이상 징후를 일찍 발견할 가능성이 커진다.
      scope: 운영사 발표이며 첫 팹 실증을 거쳐 확대하는 단계다. 로봇이 실제 이상을 찾아낸 비율, 경보가 정비 지시로 이어진 건수, 줄어든 순찰 인력은 밝히지 않았다.
    body: >-
      서브팹은 클린룸 바로 아래층에 있는 설비 공간으로, 공정 장비에 필요한 초순수·가스·전력을 공급하는 배관과 설비가 빽빽이 들어서 있다.
      넓고 소음이 크며 일부 구역은 위험해, 지금까지는 사람이 정해진 경로를 하루에도 여러 번 돌며 계기 바늘을 읽고 이상 여부를 기록해 왔다.
      Spot은 같은 경로를 스스로 걸으며 계기 바늘을 읽고, 열화상 카메라로 과열 부위를 찾고, 평소와 다른 소음을 녹음해 운영 시스템에 올린다.
      회사는 첫 팹에서 쌓은 실증 결과를 바탕으로 다른 팹 3곳에도 같은 방식을 들여온다고 밝혔다.
      다만 로봇 경보가 실제 정비 지시로 이어지는 절차와, 로봇 도입으로 사람의 순찰을 얼마나 줄였는지는 아직 공개되지 않았다.
      반도체 팹에서 4족 보행 로봇은 주로 시범 운영에 머물러 왔는데, 여러 팹으로 확대한다는 발표는 이 방식이 운영 표준으로 굳어지는 쪽으로 움직이고 있음을 보여 준다.
    watch: 로봇 순찰의 가치는 ‘얼마나 돌았나’가 아니라 ‘무엇을 먼저 찾았나’에 있다. 우리 서브팹에서 사람이 놓치기 쉬운 이상은 어떤 유형인지부터 짚어 볼 만하다.
    key_figures:
      - {value: "90,000+", label: 누적 점검 임무, why: 시범 수준이 아니라 매일 돌아가는 상시 운영 규모라는 뜻}
      - {value: "99%", label: 임무 성공률(≠ 이상 검출률), why: 로봇이 멈추지 않고 경로를 마친 비율일 뿐, 이상을 잡아낸 비율은 비공개}
      - {value: 4곳, label: 확대 대상 팹, why: 한 팹의 실험에서 여러 팹의 표준 운영 방식으로 넘어가는 단계}
    image: null
    credits: ["GlobalFoundries, 「(견본) 서브팹 로봇 점검 확대」, 2026-11-20 (영문)"]
