articles:
- event_id: EVT-SAMPLE-01
  slot: core
  title: 수 시간 걸리던 결함 원인 찾기, 삼성 AI 에이전트는 ‘수 분’
  title_alternatives: []
  tags:
  - 칩메이커
  - 현장 실증·적용
  - 운영사 발표
  deck: 삼성전자, 웨이퍼 결함 원인 분석에 AI 에이전트 적용…분석 시간 수 시간 → 수 분
  points:
    what: 삼성전자는 웨이퍼 결함이 생겼을 때 원인을 찾는 RCA 작업을 AI 에이전트가 먼저 수행하고, 엔지니어가 그 결과를 검토하는 방식으로 바꿨다.
    how_much: 엔지니어가 수 시간 걸려 하던 원인 분석이 수 분으로 줄어, 같은 인력으로 훨씬 많은 결함을 당일 안에 살펴볼 수 있게 된다.
    scope: 회사 발표 기준이며, 적용한 공정과 라인 수, 에이전트가 원인을 맞힌 비율은 공개하지 않았다.
  body: 지금까지 결함 원인 분석은 엔지니어가 설비 로그, 계측 결과, 공정 이력을 하나씩 대조하는 수작업이었다. 에이전트는 이 데이터를 한꺼번에 묶어 원인 후보와 근거를 정리해 제시하고, 엔지니어는 후보를 확인하거나 버리는 역할을 맡는다. 회사는 이 방식을 일부 팹에 적용했다고 밝혔지만, 어떤 공정부터 썼는지와 기존 분석 도구와의 연결 방식은 설명하지
    않았다. 사람이 최종 판단을 맡는 구조라 오판 위험은 줄였지만, 엔지니어 검토 시간은 별도로 든다.
  watch: 에이전트가 낸 원인 후보 중 엔지니어가 채택한 비율이 공개되는지 본다.
  key_figures:
  - value: 수 시간 → 수 분
    label: 결함 원인 분석 소요
    why: 엔지니어 1명이 하루에 볼 수 있는 결함 수가 크게 는다
  image: null
