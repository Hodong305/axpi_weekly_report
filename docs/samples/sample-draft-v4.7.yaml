  - event_id: EVT-SAMPLE-07
    slot: core
    title: 메모리 경쟁사 K, 설비 이상을 사흘 전에 알리는 AI 예지보전 팹 전체로
    title_alternatives: []
    tags: [칩메이커, 현장 실증·적용, 운영사 발표]
    deck: 메모리 경쟁사 K가 설비 이상을 미리 알리는 AI 예지보전 시스템(FabSense)을 팹 3곳으로 넓혔다. 설비가 멈추기 전에 정비하는 방식이 표준이 되고 있다는 신호다.
    points:
      what: 메모리 경쟁사 K는 설비 이상 예측 AI 시스템(FabSense)으로 센서 수집 → 이상 징후 탐지 → 고장 시점 예측 → 정비 일정 제안 중 탐지와 예측까지 맡기고, 정비 일정은 담당자가 정한다.
      how_much: 회사는 예측으로 막은 비계획 설비 정지가 전년보다 40% 줄었다고 밝혔다. 같은 설비로 더 많은 웨이퍼를 계획대로 돌릴 수 있다는 뜻이다.
      why: 설비가 갑자기 멈추면 진행 중인 웨이퍼 로트가 통째로 위험해진다. 멈추기 전에 정비하면 생산 계획이 흔들리지 않아, 같은 설비 투자로 얻는 생산량이 달라질 수 있다.
      scope: 회사 발표 기준이며 적용 설비 종류와 예측 정확도, 오경보 비율은 공개하지 않았다. 정비 일정 제안 단계는 시범 운영 중이라고 했다.
    body: >-
      메모리 경쟁사 K는 팹 설비의 온도·진동·가스 유량 같은 센서 값을 계속 모아 평소와 다른 움직임이 생기면 미리 알려 주는 AI 시스템을 운영해 왔다.
      처음에는 한 팹의 식각 설비 일부에만 적용했으나, 이번에 팹 3곳의 주요 공정 설비로 넓혔다.
      시스템은 이상 징후를 찾고 고장이 날 시점을 예측하는 데까지 맡고, 언제 어떤 부품을 교체할지는 정비 담당자가 결정한다.
      이 방식은 정해진 주기마다 부품을 바꾸던 기존 정비와 달리 설비 상태에 따라 정비 시점을 정한다는 점이 다르다.
      회사는 비계획 정지가 줄었다고 밝혔지만, 어떤 설비에서 얼마나 줄었는지와 예측이 빗나간 경우의 비용은 설명하지 않았다.
      경쟁 메모리 업체가 예지보전을 팹 단위로 확대하는 것은 설비 가동률 경쟁이 AI 활용 수준으로 옮겨 가고 있다는 점을 보여 준다.
    watch: 예지보전이 ‘시범’에서 ‘팹 표준’으로 넘어가는 신호다. 우리 설비 정지 데이터는 이런 예측 모델을 바로 학습시킬 수 있을 만큼 원인별로 쌓여 있을까?
    key_figures:
      - {value: 40%, label: 비계획 설비 정지 감소(전년 대비, 회사 주장), why: 같은 설비로 계획대로 돌리는 웨이퍼가 늘어난다는 뜻}
    image: null
    credits: ["메모리 경쟁사 K, 「(견본) AI 예지보전 확대」, 2026-11-19 (영문)"]
    search_terms: [FabSense, 예지보전]
    evidence_ids: [sample/P7]
  - event_id: EVT-SAMPLE-08
    slot: core
    title: 파운드리 경쟁사 T, 웨이퍼 반송 순서를 AI가 정한다…대기 시간 15% 단축
    title_alternatives: []
    tags: [칩메이커, 현장 실증·적용, 운영사 발표]
    deck: 파운드리 경쟁사 T가 웨이퍼 반송 순서를 AI 스케줄러(FlowMind)로 정해 장비 앞 대기 시간을 15% 줄였다. 팹 물류가 사람의 규칙에서 AI 판단으로 넘어가는 사례다.
    points:
      what: 파운드리 경쟁사 T는 웨이퍼 반송 AI 스케줄러(FlowMind)로 반송 요청 수집 → 우선순위 판단 → 경로 배정 → 차량 호출 중 우선순위 판단과 경로 배정을 맡기고, 차량 호출은 기존 시스템이 한다.
      how_much: 장비 앞에서 웨이퍼가 기다리는 시간이 15% 줄었다고 회사는 밝혔다. 장비가 웨이퍼를 기다리며 노는 시간이 그만큼 준다는 의미다.
      why: 팹 물류는 규칙을 사람이 일일이 정해 온 영역이라 공정이 복잡해질수록 한계가 있었다. AI가 실시간으로 순서를 바꾸면 급한 로트가 먼저 처리되어 생산 주기가 짧아질 수 있다.
      scope: 회사 발표 기준이며 적용한 팹 수와 반송 규모, 15%의 비교 기준(이전 규칙 방식인지)은 공개하지 않았다. 차량 제어는 이번 범위가 아니다.
    body: >-
      웨이퍼를 공정 사이로 실어 나르는 자동 반송 시스템은 팹 생산 속도를 좌우하지만, 어떤 로트를 먼저 보낼지는 오랫동안 사람이 정한 규칙에 따랐다.
      파운드리 경쟁사 T는 장비 상태와 로트의 급한 정도를 함께 보고 반송 순서를 정하는 AI 스케줄러를 한 팹의 일부 구역에 적용해 왔다.
      이번 발표에서 회사는 장비 앞 대기 시간이 줄었다는 결과를 내놓으며 같은 방식을 다른 구역으로 넓히겠다고 했다.
      스케줄러는 어느 로트를 어느 장비로 보낼지 정하는 데까지만 맡고, 실제 차량을 움직이는 제어는 기존 반송 시스템이 그대로 한다.
      그래서 AI가 틀려도 반송 자체가 멈추는 위험은 크지 않지만, 판단이 얼마나 자주 규칙 방식과 달랐는지는 알 수 없다.
      파운드리 경쟁사들이 반송 판단에 AI를 쓰기 시작했다는 점은 물류 최적화가 다음 경쟁 지점이 될 수 있음을 알려 준다.
    watch: 팹 물류 판단이 정해진 규칙에서 AI로 옮겨 가고 있다. 장비 앞 대기 시간 15%가 생산 주기 단축으로 이어지는지가 이 방식의 실제 가치를 가를 지점이다.
    key_figures:
