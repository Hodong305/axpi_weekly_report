  evidence_ids:
  - sample/P1
- event_id: EVT-SAMPLE-02
  slot: core
  title: 로봇개가 서브팹 9만 건 점검…GF, Spot을 팹 4곳으로
  title_alternatives: []
  tags:
  - Physical AI
  - 현장 실증·적용
  - 운영사 발표
  deck: GlobalFoundries, 로봇개 Spot의 서브팹 점검을 팹 4곳으로 확대…누적 9만 건
  points:
    what: GlobalFoundries는 4족 보행 로봇 Spot이 서브팹의 배관·전력·가스 설비를 돌며 열화상·소음·계기 판독 점검을 하도록 했다.
    how_much: 누적 점검 임무가 9만 건을 넘었고 임무 성공률은 99%로, 사람이 돌던 반복 순찰을 로봇이 상당 부분 대신하고 있다는 뜻이다.
    scope: 운영사 발표이며 적용 팹을 4곳으로 넓히는 단계다. 로봇이 실제 이상을 찾아낸 비율과 정비로 이어진 건수는 밝히지 않았다.
  body: 서브팹은 클린룸 아래층에 있는 설비 공간으로, 넓고 위험해 사람이 정해진 경로를 반복해 도는 점검이 많다. 로봇은 정해진 경로를 돌며 계기 바늘을 읽고, 열화상으로 과열을 찾고, 평소와 다른 소음을 기록해 운영 시스템에 올린다. 회사는 첫 팹에서의 실증 결과를 바탕으로 다른 팹 3곳에도 같은 방식을 들여온다고 밝혔다. 로봇 경보가 정비 지시로 이어지는
    절차와 사람 순찰을 얼마나 줄였는지는 아직 공개되지 않았다.
  watch: 로봇 경보가 실제 정비 지시로 이어진 비율이 나오는지 확인한다.
  key_figures:
  - value: 90,000+
    label: 누적 점검 임무
    why: 일회성 시범이 아니라 상시 운영 규모
  - value: 99%
    label: 임무 성공률 ≠ 검출률
    why: 로봇이 멈추지 않는다는 뜻, 결함 검출과 무관
  - value: 4곳
    label: 확대 대상 팹
    why: 한 팹 실증에서 여러 팹 표준으로
